version: 2

sources:
  - name: ecommerce
    description: "Raw e-commerce transactional data"
    tables:
      - name: raw_customers
        description: "One record per customer"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
      - name: raw_orders
        description: "One record per order"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: user_id
            description: "Foreign key to raw_customers"
            tests:
              - not_null